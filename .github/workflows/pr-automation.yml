name: Pull Request Automation Workflow

description: >
  Comprehensive CI/CD pipeline for Node.js projects.
  Runs ESLint, Prettier, testing, security scanning, and build validation
  on all pull request events.

# Trigger on pull request events (opened, synchronized, reopened)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Required permissions
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

# Define all environment variables
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BRANCH: ${{ github.event.pull_request.head.ref }}
  BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  # =============================================
  # JOB 1: CODE QUALITY
  # Runs ESLint and Prettier checks
  # =============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.state, 'open')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        id: eslint
        run: npx eslint . --max-warnings 0
      
      - name: Run Prettier check
        id: prettier
        run: npx prettier --check . --ignore-path .gitignore
      
      - name: Post Code Quality Report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eslintStatus = context.steps.eslint.outcome;
            const prettierStatus = context.steps.prettier.outcome;
            
            const report = `## 📋 Code Quality Report\n\n| Check | Status |\n|-------|--------|\n| ESLint | ${eslintStatus === 'success' ? '✅ Pass' : '❌ Fail'} |\n| Prettier | ${prettierStatus === 'success' ? '✅ Pass' : '❌ Fail'} |\n\n### Details\n\n- **ESLint**: Code style and quality analysis\n- **Prettier**: Code formatting verification\n\n*This report was generated by the PR Automation Workflow.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.env.PR_NUMBER,
              body: report
            });

  # =============================================
  # JOB 2: TESTING SUITE
  # Runs tests with coverage report
  # =============================================
  testing-suite:
    name: Testing Suite
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.state, 'open')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        id: tests
        run: npx jest --coverage --passWithNoTests
      
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      
      - name: Post Test Coverage Report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const testStatus = context.steps.tests.outcome;
            
            // Read coverage summary if available
            let coverageSummary = 'Coverage data generated.';
            try {
              const fs = require('fs');
              const path = require('path');
              const coverageFile = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
              if (fs.existsSync(coverageFile)) {
                const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
                const total = coverage.total;
                coverageSummary = `\n### Coverage Summary\n\n| Metric | Statements | Branches | Functions | Lines |\n|--------|------------|----------|-----------|-------|\n| ${total.pct}% | ${total.statements.pct}% | ${total.branches.pct}% | ${total.functions.pct}% | ${total.lines.pct}% |\n`;
              }
            } catch (error) {
              console.error('Failed to read coverage file:', error);
            }
            
            const report = `## 📊 Test Coverage Report\n\n| Check | Status |\n|-------|--------|\n| Test Suite | ${testStatus === 'success' ? '✅ Pass' : '❌ Fail'} |\n\n${coverageSummary}\n\n*This report was generated by the PR Automation Workflow.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.env.PR_NUMBER,
              body: report
            });

  # =============================================
  # JOB 3: SECURITY SCAN
  # Dependency and secret scanning
  # =============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.state, 'open')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit (dependency vulnerabilities)
        id: npm-audit
        run: npx npm audit --audit-level=moderate
      
      - name: Run secret scan
        id: secret-scan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Scan for potential secrets in the PR changes
            const prDiff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.env.PR_NUMBER
            }).then(r => r.data.diff);
            
            const secretPatterns = [
              /\b(api[_-]?key|apikey|api[_-]?token)\b/i,
              /\b(secret[_-]?key|private[_-]?key)\b/i,
              /\b(pass(word)?|credential)\b/i,
              /\b(jwt[_-]?token|json[_-]?web[_-]?token)\b/i,
              /\b(AWS|access[_-]?key|secret[_-]?key)\b/i
            ];
            
            const findings = [];
            secretPatterns.forEach(pattern => {
              const match = prDiff.match(pattern);
              if (match) {
                findings.push({ pattern: match[0], line: 'PR changes' });
              }
            });
            
            return { prDiff, findings, secretPatterns };
      
      - name: Post Security Scan Report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const auditStatus = context.steps['npm-audit'].outcome;
            const scanFindings = context.steps['secret-scan'].result.findings;
            
            const report = `## 🔒 Security Scan Report\n\n### Vulnerabilities\n\n| Check | Status |\n|-------|--------|\n| Dependency Audit | ${auditStatus === 'success' ? '✅ No vulnerabilities found' : '⚠️ Vulnerabilities detected'} |\n| Secret Scan | ${scanFindings.length === 0 ? '✅ No secrets detected' : `❌ ${scanFindings.length} potential secret(s) found`} |\n\n### Findings\n\n${scanFindings.map(f => `- \`${f.pattern}\` detected in ${f.line}`).join('\n') || 'No security issues detected.'}\n\n### Dependencies\n\nAll dependencies are scanned for known vulnerabilities.\n\n*This report was generated by the PR Automation Workflow.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.env.PR_NUMBER,
              body: report
            });

  # =============================================
  # JOB 4: BUILD VALIDATION
  # Build and endpoint validation
  # =============================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.state, 'open')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        id: build
        run: npm run build
      
      - name: Validate endpoints
        id: endpoints
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the PR diff to find changed API routes
            const prDiff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.env.PR_NUMBER
            }).then(r => r.data.diff);
            
            // Simulate endpoint validation (in real scenario, would start server and test)
            const endpointValidation = {
              status: 'pending',
              routes: []
            };
            
            // Extract potential endpoint changes from diff
            const routePattern = /\/(api|v\d+)\/[\w\/-]+/g;
            const matches = prDiff.match(routePattern);
            
            if (matches) {
              matches.forEach(route => {
                if (!endpointValidation.routes.includes(route)) {
                  endpointValidation.routes.push(route);
                }
              });
            }
            
            return { endpointValidation, prDiff, matches };
      
      - name: Upload deployment preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: .next/ || dist/ || build/
          retention-days: 7
      
      - name: Post Build Validation Report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildStatus = context.steps.build.outcome;
            const endpoints = context.steps.endpoints.result?.endpointValidation?.routes || [];
            
            const report = `## 🏗️ Build Validation Report\n\n| Check | Status |\n|-------|--------|\n| Build | ${buildStatus === 'success' ? '✅ Success' : '❌ Failed'} |\n| Endpoints | ${endpoints.length > 0 ? `✅ ${endpoints.length} endpoint(s) detected` : '⚠️ No API endpoints in PR'} |\n\n### Build Output\n\n${{ steps.build.outputs.stdout || 'Build completed successfully.' }}\n\n### API Endpoints\n\n${endpoints.map(e => `- \`${e}\``).join('\n') || 'No API endpoints detected in PR changes.'}\n\n*This report was generated by the PR Automation Workflow.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.env.PR_NUMBER,
              body: report
            });
