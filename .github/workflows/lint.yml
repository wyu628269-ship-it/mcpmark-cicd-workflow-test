name: Code Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint globally
        run: npm install -g eslint

      - name: Run ESLint on src/ directories
        run: eslint 'src/**/*.js'
